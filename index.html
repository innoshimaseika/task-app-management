<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク・スケジュール管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2e5a8c">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { display: grid; min-height: 100vh; place-items: center; }
    .mark {
      width: min(48vw, 192px); height: min(48vw, 192px); border-radius: 24%;
      animation: app-opening 1.1s ease-in-out infinite alternate;
    }
    @keyframes app-opening {
      from { transform: scale(.96); opacity: .88; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <img class="mark" src="icon-192.png" alt="タスク・スケジュール管理を読み込み中">
  <script>
    (function () {
      var appUrl = 'https://script.google.com/macros/s/AKfycbzFt8Us8qRK7tpNtaoAVv3JUHpVVfEEl6oLJMsNKexKlLUkDprQ80FcRRsMHtTL1ePyZQ/exec';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      }
      var delay = window.matchMedia('(display-mode: standalone)').matches ? 250 : 1400;
      window.setTimeout(function () { window.location.replace(appUrl); }, delay);
    }());
  </script>
</body>
</html>
