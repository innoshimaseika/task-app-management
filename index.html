<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>タスク・スケジュール管理</title>

<!-- ホーム画面に追加したときのアイコン・見た目の設定 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- ★Chromeなどのブラウザタブに表示されるアイコン（favicon）用。
     これが無いと、manifestやapple-touch-iconがあってもタブには
     汎用の丸アイコンが表示されてしまう。 -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タスク管理">
<meta name="theme-color" content="#2e5a8c">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* ★起動直後の一瞬だけ見える背景色。アプリ本体のナビゲーションバーの色に合わせて白系にする */
    background: #ffffff;
    overflow: hidden; /* 入口ページ自体はスクロールさせない（二重スクロール防止） */
  }
  body {
    /* ★アプリ本体（iframeの中）のナビゲーションバーが、
       ホームバー避けの余白（env(safe-area-inset-bottom)）を既に自前で持っているため、
       ここでは余白を追加しない（追加すると二重に余白ができてしまう）。
       dvh対応ブラウザでは、アドレスバーの表示/非表示による高さ変動にも追従させる */
    height: 100dvh;
  }
  #app-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <!-- ★ここにタスク管理アプリ本体を、常に画面いっぱいの高さで埋め込む -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzFt8Us8qRK7tpNtaoAVv3JUHpVVfEEl6oLJMsNKexKlLUkDprQ80FcRRsMHtTL1ePyZQ/exec"
    title="タスク・スケジュール管理"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
