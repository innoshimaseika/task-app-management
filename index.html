<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>タスク・スケジュール管理</title>

<!-- ホーム画面に追加したときのアイコン・見た目の設定 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タスク管理">
<meta name="theme-color" content="#2e5a8c">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* ★起動直後の一瞬だけ見える背景や、上下の安全領域(ノッチ・ホームバー分の余白)の色。
       アプリ本体（iframeの中）のナビゲーションバーの色に合わせて白系にし、
       「浮いた青い帯」に見えないようにする */
    background: #ffffff;
    overflow: hidden; /* 入口ページ自体はスクロールさせない（二重スクロール防止） */
  }
  body {
    /* ★iPhoneのノッチ・ホームバー分の余白を、bodyのpaddingで確保する。
       （以前は#app-frame側にposition:fixedのtop/left/right/bottomと
       width/height を同時に指定していたため、ブラウザがwidth/heightを
       優先してしまい、下側の安全領域の確保が無視され、下部が
       ホームバーに隠れて見切れる不具合があった） */
    padding-top: env(safe-area-inset-top, 0);
    padding-right: env(safe-area-inset-right, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
    padding-left: env(safe-area-inset-left, 0);
    box-sizing: border-box;
    /* dvh対応ブラウザでは、アドレスバーの表示/非表示による高さ変動にも追従させる */
    height: 100dvh;
  }
  #app-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <!-- ★ここにタスク管理アプリ本体を、常に画面いっぱいの高さで埋め込む -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyBzzm2JcPT_BpE7wsL4QnqUatVviFUvE12PKmUFGNJ_1tYqhGlcMovNKtsZIo9FyYs0A/exec"
    title="タスク・スケジュール管理"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
