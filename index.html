<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>タスク・スケジュール管理</title>

<!-- ホーム画面に追加したときのアイコン・見た目の設定 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タスク管理">
<meta name="theme-color" content="#2e5a8c">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2e5a8c;
    overflow: hidden; /* 入口ページ自体はスクロールさせない（二重スクロール防止） */
  }
  /* iPhoneのノッチ・ホームバー分の余白を確保しつつ、画面いっぱいに表示する */
  #app-frame {
    position: fixed;
    top: env(safe-area-inset-top, 0);
    left: env(safe-area-inset-left, 0);
    right: env(safe-area-inset-right, 0);
    bottom: env(safe-area-inset-bottom, 0);
    width: 100vw;
    height: 100vh;
    /* dvh対応ブラウザでは、アドレスバーの表示/非表示による高さ変動にも追従させる */
    height: 100dvh;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <!-- ★ここにタスク管理アプリ本体を、常に画面いっぱいの高さで埋め込む -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyBzzm2JcPT_BpE7wsL4QnqUatVviFUvE12PKmUFGNJ_1tYqhGlcMovNKtsZIo9FyYs0A/exec"
    title="タスク・スケジュール管理"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
